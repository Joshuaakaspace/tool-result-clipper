[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-result-clipper"
version = "0.1.0"
description = "Structure-aware clipping for LLM tool-call results at fixed token budgets."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
bench = ["matplotlib>=3.7"]
dev = ["pytest>=7"]

[project.scripts]
clip = "tool_result_clipper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
